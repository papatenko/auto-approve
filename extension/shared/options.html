<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto Accept — Settings &amp; Log</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1><img src="icons/icon32.png" alt="" width="24" height="24"> Auto Accept</h1>

    <section>
      <h2>Button keywords</h2>
      <p class="hint">
        One per line. A button is clicked when its visible label matches one of
        these words (case-insensitive).
      </p>
      <textarea id="keywords" rows="9" spellcheck="false"></textarea>

      <label class="check">
        <input type="checkbox" id="contains">
        Also match buttons that merely <em>contain</em> a keyword
        (e.g. “Accept all”). Broader, but riskier.
      </label>

      <label class="check">
        <input type="checkbox" id="shots">
        Capture a screenshot of the visible tab on every click (audit log below).
      </label>

      <label class="check">
        Scan interval:
        <input type="number" id="interval" min="2" max="60" step="1"> seconds
      </label>

      <div class="actions">
        <button id="save" class="primary">Save settings</button>
        <span id="saved" class="saved"></span>
      </div>
    </section>

    <section>
      <h2>Click log <span id="count" class="count"></span></h2>
      <p class="hint">
        Newest first. Screenshots are kept for the most recent clicks only and
        never leave your browser.
      </p>
      <div class="actions">
        <button id="clear">Clear log</button>
      </div>
      <div id="log"></div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
